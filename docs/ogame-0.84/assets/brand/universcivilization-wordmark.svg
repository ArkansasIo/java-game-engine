  <text x="600" y="242" text-anchor="middle" font-family="Orbitron, Eurostile, Bank Gothic, Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="6" fill="#00ff00">EMPIRE AT WAR</text>
