<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">UniversCivilization: Empire at War Wordmark</title>
  <desc id="desc">Horizontal sci-fi wordmark for UniversCivilization: Empire at War.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071225"/>
      <stop offset="0.5" stop-color="#344566"/>
      <stop offset="1" stop-color="#071225"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
