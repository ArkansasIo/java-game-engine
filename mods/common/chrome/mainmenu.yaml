		Container@PERFORMANCE_INFO:
			Logic: PerfDebugLogic
			Children:
				Label@PERF_TEXT:
					X: 30
					Y: WINDOW_HEIGHT - 70
					Width: 170
					Height: 40
					Contrast: true
				Background@GRAPH_BG:
					X: WINDOW_WIDTH - 240
					Y: WINDOW_HEIGHT - 240
					Width: 210
					Height: 210
					Background: panel-black
					Children:
						PerfGraph@GRAPH:
							X: 5
							Y: 5
							Width: 200
							Height: 200
