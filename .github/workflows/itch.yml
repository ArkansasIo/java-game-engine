name: Deploy itch.io Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git Tag'
        required: true
        default: 'release-xxxxxxxx'

permissions: {}
jobs:
  itch:
    name: Deploy to itch.io
    runs-on: ubuntu-22.04
    if: github.repository == 'Arklight/Arklight'
    steps:
      - name: Download Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          wget -cq -O butler-linux-amd64.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler-linux-amd64.zip
          rm butler-linux-amd64.zip
          chmod +x butler
          ./butler -V
          ./butler login

      - name: Publish Windows Installer
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          wget -q "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}/Arklight-${{ github.event.inputs.tag }}-x64.exe"
          ./butler push "Arklight-${{ github.event.inputs.tag }}-x64.exe" "Arklight/Arklight:win" --userversion ${{ github.event.inputs.tag }}

      - name: Publish Windows Itch Bundle
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          wget -q "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.inputs.tag }}/packaging/.itch.toml"
          zip -u "Arklight-${{ github.event.inputs.tag }}-x64-win-itch.zip" .itch.toml
          ./butler push "Arklight-${{ github.event.inputs.tag }}-x64-win-itch.zip" "Arklight/Arklight:itch" --userversion ${{ github.event.inputs.tag }}

      - name: Publish macOS Package
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          wget -q "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}/Arklight-${{ github.event.inputs.tag }}.dmg"
          ./butler push "Arklight-${{ github.event.inputs.tag }}.dmg" "Arklight/Arklight:macos" --userversion ${{ github.event.inputs.tag }}

      - name: Publish RA AppImage
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          wget -q "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}/Arklight-Red-Alert-x86_64.AppImage"
          ./butler push "Arklight-Red-Alert-x86_64.AppImage" "Arklight/Arklight:linux-ra" --userversion ${{ github.event.inputs.tag }}

      - name: Publish TD AppImage
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          wget -q "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}/Arklight-Tiberian-Dawn-x86_64.AppImage"
          ./butler push "Arklight-Tiberian-Dawn-x86_64.AppImage" "Arklight/Arklight:linux-cnc" --userversion ${{ github.event.inputs.tag }}

      - name: Publish D2k AppImage
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          wget -q "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}/Arklight-Dune-2000-x86_64.AppImage"
          ./butler push "Arklight-Dune-2000-x86_64.AppImage" "Arklight/Arklight:linux-d2k" --userversion ${{ github.event.inputs.tag }}

